# main에 올라오면 app/을 빌드해 gh-pages 브랜치에 올린다(GitHub Pages가 이 브랜치를 보여 준다).
# 저장소에는 코드만 있다. 문항은 로그인 후 Supabase에서 받는다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: ./build.sh && rm -f dist/artifact.html
      - name: 한의학 문제은행(hanui/)을 같이 올리기
        run: |
          cp -r ../hanui dist/hanui
          rm -f dist/hanui/schema.sql
          sed -i "s/__VERSION__/$(date +%Y%m%d%H%M%S)/" dist/hanui/sw.js
      - name: 문항·그림이 섞여 들어가지 않았는지 확인
        run: |
          test ! -e dist/data && test ! -e dist/img
          ! grep -rq '"nblank"' dist/hanui
      - name: gh-pages 브랜치에 올리기
        working-directory: app/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "deploy ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
